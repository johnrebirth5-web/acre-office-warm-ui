name: Secret Scan History

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks against git history
        id: gitleaks
        run: |
          bash ./scripts/run-gitleaks.sh detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner

      - name: Open or update tracking issue
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Secret scan history detected potential leaks";
            const labels = ["security", "secret-scan"];

            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: name === "security" ? "b60205" : "5319e7",
                  description:
                    name === "security"
                      ? "Security-related maintenance follow-up."
                      : "Potential secret leak detected by the scheduled scanner.",
                });
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: labels.join(","),
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            const body = [
              "The weekly full-history gitleaks scan detected at least one potential leak.",
              "",
              `- Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              "",
              "Please review the run logs, confirm whether the finding is expected, and update `.gitleaks.toml` or rotate the secret as needed.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels,
            });
