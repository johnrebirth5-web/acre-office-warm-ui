name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gitleaks
        run: bash ./scripts/run-gitleaks.sh detect --source . --no-git --config .gitleaks.toml --redact --no-banner
